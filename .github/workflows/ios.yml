name: Sync upstream and build unsigned iOS

on:
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:
  push:
    branches: [codex/ios-build]
    paths: [.github/workflows/ios.yml, scripts/**, action-pins.json]

permissions:
  contents: read

concurrency:
  group: open-grind-ios
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
      build: ${{ steps.sync.outputs.build }}
    steps:
      - name: Check out automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Test build preparation and IPA validation
        run: python3 -m unittest discover -s scripts -v
      - name: Mirror upstream iOS and check for a current artifact
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://git.opengrind.org/open-grind/open-grind.git
          git fetch --no-tags upstream ios:refs/remotes/upstream/ios
          upstream_sha=$(git rev-parse refs/remotes/upstream/ios)
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          existing=$(git ls-remote origin refs/heads/upstream/ios | cut -f1)
          if [[ -n "$existing" && "$existing" != "$upstream_sha" ]]; then
            git fetch --no-tags origin refs/heads/upstream/ios
            git merge-base --is-ancestor "$existing" "$upstream_sha" || {
              echo 'Upstream rewrote history; manual review is needed before updating the mirror.' >&2
              exit 1
            }
          fi
          git push origin "$upstream_sha:refs/heads/upstream/ios"
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f "name=open-grind-ios-$upstream_sha" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$count" -gt 0 ]]; then
            build=false
          fi
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Upstream iOS: $upstream_sha; build: $build" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
      CARGO_BUILD_JOBS: '3'
      npm_config_cache: /tmp/open-grind-npm-cache
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned upstream source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sync.outputs.upstream_sha }}
          path: source
          submodules: recursive
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Set up Rust for physical iPhones
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios
      - name: Prepare unsigned iOS configuration
        run: |
          python3 scripts/prepare_ios.py source
          mkdir -p artifacts
          git -C source diff > artifacts/build-adjustments.patch
          xcodebuild -version
      - name: Install locked dependencies
        working-directory: source
        run: bun install --frozen-lockfile
      - name: Build unsigned physical-device IPA
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          projectPath: source
          tauriScript: bun tauri
          mobile: ios
          args: --target aarch64 --no-sign --ci
          uploadWorkflowArtifacts: false
      - name: Validate IPA and record provenance
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess
          candidates = list(pathlib.Path('source/src-tauri/gen/apple/build').rglob('*.ipa'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected one IPA, found {len(candidates)}')
          ipa = candidates[0]
          result = json.loads(subprocess.check_output(['python3', 'scripts/verify_ipa.py', str(ipa)]))
          target = pathlib.Path('artifacts') / 'open-grind-ios-unsigned.ipa'
          shutil.copy2(ipa, target)
          (target.parent / 'SHA256SUMS').write_text(f"{result['sha256']}  {target.name}\n")
          result.update(upstream_commit=os.environ['UPSTREAM_SHA'],
                        upstream_url='https://git.opengrind.org/open-grind/open-grind',
                        upstream_branch='ios', automation_commit=os.environ['GITHUB_SHA'],
                        workflow_run=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                        xcode=subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
                        iphone_runtime='not tested')
          (target.parent / 'provenance.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Unsigned IPA built from `{result['upstream_commit']}`.\n\nSHA256: `{result['sha256']}`\n\nRequires personal signing before installation. iPhone runtime not tested.\n")
          PY
          cd artifacts
          shasum -a 256 -c SHA256SUMS
      - name: Upload verified unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-grind-ios-${{ needs.sync.outputs.upstream_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
